<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mad-ME-BTS-Prog - Skate Jump Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-title {
            font-size: 36px;
            font-weight: 900;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #333;
            text-align: center;
        }

        #score-board {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 250px;
            border-bottom: 5px solid #333;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            overflow: hidden;
            cursor: pointer;
        }

        #skater {
            width: 40px;
            height: 60px;
            position: absolute;
            bottom: 0;
            left: 50px;
            background-color: #ff4757;
            border-radius: 5px;
        }

        #skater::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 50px;
            height: 8px;
            background-color: #2ed573;
            border-radius: 4px;
        }

        #obstacle {
            width: 25px;
            height: 40px;
            background-color: #ffa502;
            position: absolute;
            bottom: 0;
            left: 100%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .jump {
            animation: jumpAnimation 0.5s linear;
        }

        @keyframes jumpAnimation {
            0% { bottom: 0; transform: rotate(0deg); }
            50% { bottom: 120px; transform: rotate(-180deg); }
            100% { bottom: 0; transform: rotate(-360deg); }
        }

        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: bold;
            color: #ff4757;
            text-align: center;
            width: 100%;
        }

        /* --- ÉCRAN DE LA PUB AVEC LOGO ET TITRE --- */
        #simulation-pub {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e272e;
            z-index: 20;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #logo-simu {
            width: 80px;
            height: 35px;
            background-color: #ff4757;
            border-radius: 6px;
            position: relative;
            margin-bottom: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        #logo-simu::before, #logo-simu::after {
            content: '';
            position: absolute;
            bottom: -6px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            border: 2px solid #2ed573;
        }
        #logo-simu::before { left: 8px; }
        #logo-simu::after { right: 8px; }

        .badge-gratuit {
            background-color: #2ed573;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .barre-chargement-conteneur {
            width: 50%;
            height: 6px;
            background-color: #485460;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .barre-chargement-progression {
            width: 0%;
            height: 100%;
            background-color: #2ed573;
            animation: faussePubAnim 5s linear forwards;
        }

        @keyframes faussePubAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="game-title">Mad-ME-BTS-Prog</div>

    <div id="score-board">Score : <span id="score">0</span></div>
    
    <div id="game-container">
        <div id="skater"></div>
        <div id="obstacle"></div>
        <div id="game-over-text"></div>
        
        <!-- ÉCRAN DE PUB SIMULÉE SANS COMPORTEMENT CAPRICIEUX -->
        <div id="simulation-pub">
            <div class="badge-gratuit">100% GRATUIT</div>
            <div id="logo-simu"></div>
            <h2 style="color: #ffffff; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px;">Mad-ME-BTS-Prog</h2>
            <p style="font-size: 12px; color: #dcdde1; margin-bottom: 5px;">Skate Jump Game</p>
            <p id="decompte" style="font-size: 32px; font-weight: 900; color: #ffa502;">5s</p>
            <div class="barre-chargement-conteneur">
                <div class="barre-chargement-progression"></div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const skater = document.getElementById("skater");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");
        const simuPub = document.getElementById("simulation-pub");
        const decompteDisplay = document.getElementById("decompte");

        let score = 0;
        let isJumping = false;
        let isGameOver = false;
        let isWatchingPub = false; 
        let obstacleSpeed = 6;
        let obstacleLeft = 100; // Gère la position de l'obstacle en %
        let animationFrameId;

        if (typeof PokiSDK !== 'undefined') {
            PokiSDK.init().then(() => {
                console.log("Poki SDK chargé avec succès !");
            }).catch(() => {
                console.log("Mode test actif.");
            });
        }

        function handleAction(event) {
            if (isWatchingPub) return;
            if (event && event.target && event.target.id === 'revive-btn') {
                return;
            }
            
            if (isGameOver) {
                resetGame();
            } else {
                jump();
            }
        }

        window.addEventListener("touchstart", function(event) {
            if (event.target && event.target.id === 'revive-btn') return;
            if (isWatchingPub) return;
            
            event.preventDefault(); 
            handleAction(event);
        }, { passive: false });

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault(); 
                handleAction(event);
            }
        });

        window.addEventListener("mousedown", function(event) {
            if (event.pointerType !== 'touch') {
                handleAction(event);
            }
        });

        function jump() {
            if (isJumping || isWatchingPub || isGameOver) return;
            isJumping = true;
            skater.classList.add("jump");

            setTimeout(() => {
                skater.classList.remove("jump");
                isJumping = false;
            }, 500); 
        }

        // --- LA BOUCLE DE JEU QUE J'AI CORRIGÉE ET FERMÉE ---
        function gameLoop() {
            if (isGameOver || isWatchingPub) return;

            // Fait avancer le bloc de droite à gauche
            obstacleLeft -= (obstacleSpeed / container.clientWidth) * 100;
            
            // Si le bloc sort de l'écran, il revient à droite et ajoute 1 point
            if (obstacleLeft <= -5) {
                obstacleLeft = 100;
                score++;
                scoreDisplay.textContent = score;
                if (obstacleSpeed < 14) obstacleSpeed += 0.2; // Augmente la difficulté
            }
            
            obstacle.style.left = obstacleLeft + "%";

            // Vérification des collisions géométriques entre le skateur et le bloc
            let skaterRect = skater.getBoundingClientRect();
            let obstacleRect = obstacle.getBoundingClientRect();

            if (
                skaterRect.right > obstacleRect.left &&
                skaterRect.left < obstacleRect.right &&
                skaterRect.bottom > obstacleRect.top
            ) {
                endGame();
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);
            gameOverText.innerHTML = "GAME OVER<br><span style='font-size:16px; color:#333;'>Cliquez ou Espace pour rejouer</span>";
            gameOverText.style.display = "block";
        }

        function resetGame() {
            score = 0;
            obstacleSpeed = 6;
            obstacleLeft = 100;
            isGameOver = false;
            isJumping = false;
