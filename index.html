<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mad-BTS-Prog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header-ui {
            padding: 10px;
            text-align: center;
            color: white;
            background: #222;
            z-index: 10;
        }
        h1 {
            font-size: 1.4rem;
        }
        p {
            font-size: 0.8rem;
            color: #ccc;
        }
        .game-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        canvas {
            background-color: #87CEEB;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="header-ui">
        <h1>Mad-BTS-Prog</h1>
        <p>Touchez l'écran ou Espace pour faire un Kickflip !</p>
    </div>
    
    <div class="game-container">
        <canvas id="jeuCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("jeuCanvas");
const ctx = canvas.getContext("2d");

// Configuration dynamique du canvas
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = canvas.parentElement.clientHeight;
    
    GROUND_Y = canvas.height - 100; 
    if (!skater.isJumping) {
        skater.y = GROUND_Y;
    }
    obstacle.y = GROUND_Y + 20;
}

// Variables physiques globales
let GROUND_Y = 200;
const GRAVITY = 0.6;
const JUMP_POWER = -12;

const airTimeFrames = Math.abs(JUMP_POWER / GRAVITY) * 2;
const rotationStep = (Math.PI * 2) / airTimeFrames;

let skater = {
    x: 50,
    y: GROUND_Y,
    width: 40,
    height: 60,
    vy: 0,
    gravity: GRAVITY,
    jumpPower: JUMP_POWER,
    isJumping: false,
    angle: 0
};

let obstacle = {
    x: 800,
    y: 220,
    width: 30,
    height: 40,
    speed: 6
};

let score = 0;
let gameOver = false;
let pubEnCours = false; // Gère l'état d'attente de la pub

// Initialisation de la taille de l'écran
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

function handleAction() {
    // Si une pub est en cours, les clics sur l'écran ne font rien
    if (pubEnCours) return;

    if (!skater.isJumping && !gameOver) {
        skater.vy = skater.jumpPower;
        skater.isJumping = true;
    } else if (gameOver) {
        // Au clic après un game over, on lance la simulation de pub
        lancerPubPre-Reward();
    }
}

// Contrôles
document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        handleAction();
    }
});

window.addEventListener("touchstart", function(e) {
    handleAction();
}, { passive: true });

function lancerPubPre-Reward() {
    gameOver = false;
    pubEnCours = true;
    
    // Déclenche une fausse alerte de chargement
    alert("🎬 Chargement de la vidéo publicitaire (Test AdMob)...\n\nPatientez 3 secondes pour revivre !");
    
    setTimeout(function() {
        pubEnCours = false;
        revivreSkateur();
    }, 3000);
}

function revivreSkateur() {
    // Réinitialise le skateur sans remettre le score à zéro !
    skater.y = GROUND_Y;
    skater.vy = 0;
    skater.isJumping = false;
    skater.angle = 0;
    obstacle.x = canvas.width + 150; // Repousse l'obstacle pour laisser une marge
    loop();
}

function resetGame() {
    skater.y = GROUND_Y;
    skater.vy = 0;
    skater.isJumping = false;
    skater.angle = 0;
    obstacle.x = canvas.width + 50;
    obstacle.speed = 6;
    score = 0;
    gameOver = false;
    loop();
}

function update() {
    if (gameOver || pubEnCours) return;

    // Physique du saut
    skater.vy += skater.gravity;
    skater.y += skater.vy;

    if (skater.isJumping) {
        skater.angle += rotationStep;
    }

    // Détection du sol
    if (skater.y > GROUND_Y) {
        skater.y = GROUND_Y;
        skater.vy = 0;
        skater.isJumping = false;
        skater.angle = 0; 
    }

    // Mouvement de l'obstacle
    obstacle.x -= obstacle.speed;
    if (obstacle.x < -obstacle.width) {
        obstacle.x = canvas.width + Math.random() * 100;
        score++;
        obstacle.speed += 0.3;
    }

    // Collisions
    let skaterHitbox = {
        x: skater.x + 8,
        y: skater.y + 5,
        width: skater.width - 16,
        height: skater.height - 5
    };

    if (
        obstacle.x < skaterHitbox.x + skaterHitbox.width &&
        obstacle.x + obstacle.width > skaterHitbox.x &&
        obstacle.y < skaterHitbox.y + skaterHitbox.height &&
        obstacle.y + obstacle.height > skaterHitbox.y
    ) {
        gameOver = true;
    }
}

function drawSkater() {
    ctx.save();
    ctx.translate(skater.x + skater.width / 2, skater.y + skater.height / 2);
    ctx.rotate(skater.angle);

    let ox = -skater.width / 2;
    let oy = -skater.height / 2;

    // Torse
    ctx.fillStyle = "#3498db";
    ctx.fillRect(ox + 10, oy + 20, 20, 25);

    // Tête
    ctx.fillStyle = "#ffdbac";
    ctx.fillRect(ox + 13, oy + 5, 14, 15);

    // Casquette
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(ox + 10, oy, 17, 6); 
    ctx.fillRect(ox + 18, oy + 4, 14, 3); 

    // Pantalon
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(ox + 10, oy + 45, 9, 10); 
    ctx.fillRect(ox + 21, oy + 45, 9, 10); 

    // Skate
    ctx.fillStyle = "#d35400"; 
    ctx.fillRect(ox, oy + 55, skater.width, 5);

    ctx.fillStyle = "#000"; 
    ctx.beginPath();
    ctx.arc(ox + 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ox + skater.width - 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    // Ciel
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Soleil
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(canvas.width - 80, 50, 30, 0, Math.PI * 2);
    ctx.fill();

    // Sol adaptatif
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(0, GROUND_Y + 60, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = "#95a5a6"; 
    ctx.fillRect(0, GROUND_Y + 60, canvas.width, 4);

    drawSkater();

    // Obstacle
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(obstacle.x + 5, obstacle.y - 5, obstacle.width - 10, 5);

    // Score
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";

    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 4;
    ctx.fillText("Score : " + score, 20, 35);
    ctx.shadowBlur = 0;

    if (pubEnCours) {
        // Écran noir pendant le chargement de la pub
        ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 24px Arial";
        ctx.fillText("PUBLICITÉ EN COURS...", canvas.width / 2, canvas.height / 2);
        ctx.textAlign = "left";
    } else if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 30px Arial";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "16px Arial";
        ctx.fillStyle = "#4CAF50"; // Message en vert pour attirer l'oeil
        ctx.fillText("🎬 Cliquez pour voir une pub et REVIVRE !", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = "left";
    }
}

function loop() {
    update();
    draw();
    if (!gameOver && !pubEnCours) {
        requestAnimationFrame(loop);
    }
}

// Lancement automatique du jeu
loop();
</script>
</body>
</html>
