<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skate Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #87CEEB;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #ffcc00;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            box-shadow: 0 5px 0 #b38f00;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b38f00;
        }
        #ad-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <button id="adBtn" class="btn">Regarder une pub pour continuer</button>
    </div>

    <div id="ad-screen">
        <p>🎞️ Publicité en cours...</p>
        <p id="ad-timer">Attente Poki Dev : 3s</p>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Adaptation taille écran
canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth;
canvas.height = 400;

// Variables de jeu
let score = 0;
let gameOver = false;
let isAdState = false;

// Variables physiques
const gravity = 0.6;
const groundY = canvas.height - 60;

// Objet Skateur
const player = {
    x: 80,
    y: groundY - 50,
    width: 40,
    height: 60,
    vy: 0,
    isJumping: false,
    isRolling: false,
    rollTimer: 0,
    
    jump() {
        if (!this.isJumping && !this.isRolling) {
            this.vy = -13;
            this.isJumping = true;
        }
    },
    
    roll() {
        if (!this.isJumping && !this.isRolling) {
            this.isRolling = true;
            this.rollTimer = 25; // Durée de la roulade en frames
            this.height = 30;    // Devient plus petit
            this.y = groundY - 30;
        }
    },

    update() {
        // Gravité et saut
        this.vy += gravity;
        this.y += this.vy;

        if (this.y > groundY - this.height) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.isJumping = false;
        }

        // Gestion de la roulade
        if (this.isRolling) {
            this.rollTimer--;
            if (this.rollTimer <= 0) {
                this.isRolling = false;
                this.height = 60;
                this.y = groundY - this.height;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isRolling) {
            // Dessin Roulade (Balle / Roulis)
            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.arc(this.width/2, this.height/2, 20, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Corps du skateur
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(0, 0, this.width, this.height);

            // Casquette (Visière à droite)
            ctx.fillStyle = "#000";
            ctx.fillRect(5, -10, 30, 10); // Calotte
            ctx.fillRect(20, -7, 25, 4);  // Visière
            
            // Yeux
            ctx.fillStyle = "#fff";
            ctx.fillRect(25, 5, 8, 8);
            ctx.fillStyle = "#000";
            ctx.fillRect(29, 5, 4, 4);

            // Planche de skate
            ctx.fillStyle = "#795548";
            ctx.fillRect(-5, this.height, this.width + 10, 6);
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(2, this.height + 9, 4, 0, Math.PI*2);
            ctx.arc(this.width - 2, this.height + 9, 4, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }
};

// Gestion des obstacles
let obstacles = [];
let spawnTimer = 0;

function spawnObstacle() {
    const type = Math.random() > 0.5 ? "high" : "low";
    if (type === "high") {
        // Obstacle haut (nécessite roulade)
        obstacles.push({
            x: canvas.width,
            y: groundY - 70,
            width: 30,
            height: 35,
            color: "#e91e63",
            type: "high"
        });
    } else {
        // Obstacle bas (nécessite saut)
        obstacles.push({
            x: canvas.width,
            y: groundY - 35,
            width: 30,
            height: 35,
            color: "#9c27b0",
            type: "low"
        });
    }
}

// Contrôles Clavier
window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        player.jump();
    }
    if (e.code === "ArrowDown" || e.code === "KeyS") {
        e.preventDefault();
        player.roll();
    }
});

// Contrôles Tactiles (Mobiles)
window.addEventListener("touchstart", (e) => {
    const touchY = e.touches[0].clientY;
    // Si clique sur la moitié haute de l'écran = Saut, moitié basse = Roulade
    if (touchY < window.innerHeight / 2) {
        player.jump();
    } else {
        player.roll();
    }
});

// Bouton Pub & Continuer
const adBtn = document.getElementById("adBtn");
const adScreen = document.getElementById("ad-screen");
const adTimerText = document.getElementById("ad-timer");

adBtn.addEventListener("click", () => {
    adBtn.style.display = "none";
    adScreen.style.display = "flex";
    isAdState = true;
    
    let timeLeft = 3; // Pause de 3 secondes
    adTimerText.innerText = `Attente Poki Dev : ${timeLeft}s`;

    let interval = setInterval(() => {
        timeLeft--;
        adTimerText.innerText = `Attente Poki Dev : ${timeLeft}s`;
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            adScreen.style.display = "none";
            
            // Relancer le jeu SANS reset le score
            gameOver = false;
            isAdState = false;
            obstacles = []; // Vide les obstacles à l'écran pour éviter de mourir direct
            loop();
        }
    }, 1000);
});

// Boucle principale du jeu
function loop() {
    if (gameOver || isAdState) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dessin du sol
    ctx.fillStyle = "#333";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Mise à jour du joueur
    player.update();
    player.draw();

    // Gestion des obstacles
    spawnTimer++;
    if (spawnTimer > 90) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= 5; // Vitesse de défilement

        // Dessin obstacle
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // Détection des collisions (AABB)
        if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            gameOver = true;
            adBtn.style.display = "block"; // Affiche le bouton pub
        }

        // Supprimer obstacles hors écran
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
            score += 10;
        }
    }

    // Affichage Score
    ctx.fillStyle = "#000";
    ctx.font = "24px Arial";
    ctx.fillText(`Score: ${score}`, 20, 40);

    requestAnimationFrame(loop);
}

// Lancement
loop();
</script>
</body>
</html>
