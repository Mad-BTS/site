<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mad-BTS-Prog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header-ui {
            padding: 10px;
            text-align: center;
            color: white;
            background: #222;
            z-index: 10;
        }
        h1 { font-size: 1.4rem; }
        p { font-size: 0.8rem; color: #ccc; }
        .game-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        canvas {
            background-color: #87CEEB;
            display: block;
            width: 100%;
            height: 100%;
        }
        #game-over-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center; align-items: center;
            z-index: 99999;
        }
        .modal-content {
            background-color: #222222; color: #ffffff; padding: 25px;
            border-radius: 15px; text-align: center; border: 3px solid #ff5722;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6); width: 280px;
        }
        .modal-content button {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
        }
        #btn-revive { background-color: #4CAF50; color: white; }
        #btn-restart { background-color: #f44336; color: white; }
    </style>
</head>
<body>

    <div class="header-ui">
        <h1>Mad-BTS-Prog</h1>
        <p>Touchez l'écran ou Espace pour faire un Kickflip !</p>
    </div>
    
    <div class="game-container">
        <canvas id="jeuCanvas"></canvas>
    </div>

    <div id="game-over-screen">
        <div class="modal-content">
            <h2>🛹 CHUTE !</h2>
            <p>Votre score actuel : <span id="current-score">0</span> points</p>
            <button id="btn-revive" onclick="demanderPubRevivre()">🎬 Revivre (Regarder une pub)</button>
            <button id="btn-restart" onclick="recommencerPartie()">❌ Abandonner</button>
        </div>
    </div>

<script>
const canvas = document.getElementById("jeuCanvas");
const ctx = canvas.getContext("2d");

// Forçage de dimensions fixes de secours immédiat
canvas.width = window.innerWidth || 800;
canvas.height = window.innerHeight > 150 ? window.innerHeight - 80 : 400;

let GROUND_Y = canvas.height - 120;
const GRAVITY = 0.6;
const JUMP_POWER = -12;

const airTimeFrames = Math.abs(JUMP_POWER / GRAVITY) * 2;
const rotationStep = (Math.PI * 2) / airTimeFrames;

let skater = {
    x: 50,
    y: GROUND_Y,
    width: 40,
    height: 60,
    vy: 0,
    gravity: GRAVITY,
    jumpPower: JUMP_POWER,
    isJumping: false,
    angle: 0
};

let obstacle = {
    x: canvas.width + 100,
    y: GROUND_Y + 20,
    width: 30,
    height: 40,
    speed: 6
};

let score = 0;
let gameOver = false;
let scoreActuel = 0;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    if (canvas.parentElement && canvas.parentElement.clientHeight > 0) {
        canvas.height = canvas.parentElement.clientHeight;
    } else {
        canvas.height = window.innerHeight - 80;
    }
    GROUND_Y = canvas.height - 120; 
    if (!skater.isJumping) {
        skater.y = GROUND_Y;
    }
    obstacle.y = GROUND_Y + 20;
}

window.addEventListener('resize', resizeCanvas);
// Forcer le recalcul après le chargement complet du layout
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas, 200);

function handleAction() {
    let ecranPub = document.getElementById("game-over-screen");
    if (ecranPub && ecranPub.style.display === "flex") return;

    if (!skater.isJumping && !gameOver) {
        skater.vy = skater.jumpPower;
        skater.isJumping = true;
    } else if (gameOver) {
        resetGame();
    }
}

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        handleAction();
    }
});

window.addEventListener("touchstart", function(e) {
    handleAction();
}, { passive: true });

function resetGame() {
    resizeCanvas();
    skater.y = GROUND_Y;
    skater.vy = 0;
    skater.isJumping = false;
    skater.angle = 0;
    obstacle.x = canvas.width + 50;
    obstacle.speed = 6;
    score = 0;
    gameOver = false;
    loop();
}

function update() {
    if (gameOver) return;

    skater.vy += skater.gravity;
    skater.y += skater.vy;

    if (skater.isJumping) {
        skater.angle += rotationStep;
    }

    if (skater.y > GROUND_Y) {
        skater.y = GROUND_Y;
        skater.vy = 0;
        skater.isJumping = false;
        skater.angle = 0; 
    }

    obstacle.x -= obstacle.speed;
    if (obstacle.x < -obstacle.width) {
        obstacle.x = canvas.width + Math.random() * 100;
        score++;
        obstacle.speed += 0.3;
    }

    let skaterHitbox = {
        x: skater.x + 8,
        y: skater.y + 5,
        width: skater.width - 16,
        height: skater.height - 5
    };

    if (
        obstacle.x < skaterHitbox.x + skaterHitbox.width &&
        obstacle.x + obstacle.width > skaterHitbox.x &&
        obstacle.y < skaterHitbox.y + skaterHitbox.height &&
        obstacle.y + obstacle.height > skaterHitbox.y
    ) {
        gameOver = true;
        declencherGameOver(score);
    }
}

function declencherGameOver(scoreDuJoueur) {
    scoreActuel = scoreDuJoueur || 0;
    let ecran = document.getElementById("game-over-screen");
    let texteScore = document.getElementById("current-score");
    if (texteScore) texteScore.innerText = scoreActuel;
    if (ecran) ecran.style.display = "flex";
}

function demanderPubRevivre() {
    alert("🎬 Affichage de la publicité (Test)...\n\nVotre skateur repart dans 3 secondes !");
    setTimeout(function() {
        accorderSecondeChance();
    }, 3000);
}

function accorderSechance() {
    // Reste ici pour compatibilité au cas où
    accorderSecondeChance();
}

function accorderSecondeChance() {
    let ecran = document.getElementById("game-over-screen");
    if (ecran) ecran.style.display = "none";
    
    gameOver = false;
    skater.y = GROUND_Y;
    skater.vy = 0;
    skater.isJumping = false;
    skater.angle = 0;
    obstacle.x = canvas.width + 150; 
    
    loop();
}

function recommencerPartie() {
    let ecran = document.getElementById("game-over-screen");
    if (ecran) ecran.style.display = "none";
    resetGame();
}

function drawSkater() {
    ctx.save();
    ctx.translate(skater.x + skater.width / 2, skater.y + skater.height / 2);
    ctx.rotate(skater.angle);

    let ox = -skater.width / 2;
    let oy = -skater.height / 2;

    ctx.fillStyle = "#3498db";
    ctx.fillRect(ox + 10, oy + 20, 20, 25);

    ctx.fillStyle = "#ffdbac";
    ctx.fillRect(ox + 13, oy + 5, 14, 15);

    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(ox + 10, oy, 17, 6); 
    ctx.fillRect(ox + 18, oy + 4, 14, 3); 

    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(ox + 10, oy + 45, 9, 10); 
    ctx.fillRect(ox + 21, oy + 45, 9, 10); 

    ctx.fillStyle = "#d35400"; 
    ctx.fillRect(ox, oy + 55, skater.width, 5);

    ctx.fillStyle = "#000"; 
    ctx.beginPath();
    ctx.arc(ox + 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ox + skater.width - 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(canvas.width - 80, 50, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(0, GROUND_Y + 60, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = "#95a5a6"; 
    ctx.fillRect(0, GROUND_Y + 60, canvas.width, 4);

    drawSkater();

    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(obstacle.x + 5, obstacle.y - 5, obstacle.width - 10, 5);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 4;
    ctx.fillText("Score : " + score, 20, 35);
    ctx.shadowBlur = 0;

    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function loop() {
    update();
    draw();
    if (!gameOver) {
        requestAnimationFrame(loop);
    }
}

// Lancement direct sécurisé
resizeCanvas();
loop();
</script>
</body>
</html>
