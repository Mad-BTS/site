<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkateRoll - Version Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1e272e;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(#00d2d3, #1dd1a1);
            position: relative;
            overflow: hidden;
        }
        /* En-tête de l'écran de jeu */
        #game-header {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        #logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.25);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        /* Design du Logo de Skate Personnalisé */
        #custom-logo {
            width: 32px;
            height: 12px;
            background: #ff9f43;
            border-radius: 6px;
            position: relative;
            border: 2px solid #2f3542;
        }
        #custom-logo::before, #custom-logo::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #2f3542;
            border-radius: 50%;
            bottom: -5px;
        }
        #custom-logo::before { left: 4px; }
        #custom-logo::after { right: 4px; }

        #game-title {
            color: white;
            font-weight: 800;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #badge-gratuit {
            background-color: #ff4757;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        #score-display {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 26px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20vh;
            background-color: #3d3d3d;
            border-top: 8px solid #57606f;
        }
        #skater {
            width: 60px;
            height: 70px;
            position: absolute;
            bottom: 20vh;
            left: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            z-index: 5;
        }
        .jump {
            animation: jumpRollAnimation 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes jumpRollAnimation {
            0% { bottom: 20vh; transform: rotate(0deg); }
            50% { bottom: calc(20vh + 160px); transform: rotate(180deg); }
            100% { bottom: 20vh; transform: rotate(360deg); }
        }
        #obstacle {
            width: 35px;
            height: 35px;
            background-color: #ee5253;
            position: absolute;
            bottom: calc(20vh + 55px);
            left: 100vw;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4d4d;
        }
        /* Écran de Fin de Partie */
        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 20;
            width: 85%;
            max-width: 340px;
        }
        #game-over-text h2 {
            color: #ff4757;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        #revive-btn {
            background: linear-gradient(135deg, #2ed573, #1dd1a1);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0px 6px 15px rgba(46, 213, 115, 0.4);
            text-transform: uppercase;
        }
        /* ÉCRAN PUBLICITAIRE EN PHOTO AVEC DEGRADÉ ET METZ VOS TEXTES */
        #pub-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2f3542, #747d8c);
            z-index: 30;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #pub-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 28px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            max-width: 350px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        /* Logo dans l'affiche de publicité */
        #pub-logo {
            width: 70px;
            height: 25px;
            background: #ff9f43;
            border-radius: 10px;
            margin: 0 auto 25px auto;
            position: relative;
            border: 3px solid white;
        }
        #pub-logo::before, #pub-logo::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            bottom: -10px;
        }
        #pub-logo::before { left: 8px; }
        #pub-logo::after { right: 8px; }

        #pub-title {
            font-size: 32px;
            font-weight: 900;
            color: #1dd1a1;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        #pub-text {
            font-size: 18px;
            color: #f1f2f6;
            margin-bottom: 35px;
            line-height: 1.4;
            font-weight: 500;
        }
        #pub-timer-btn {
            background: #ff4757;
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 30px;
            border: none;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #tap-instruction {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- En-tête -->
        <div id="game-header">
            <div id="logo-container">
                <div id="custom-logo"></div>
                <span id="game-title">SkateRoll</span>
            </div>
            <div id="badge-gratuit">Gratuit</div>
        </div>

        <div id="score-display">SCORE : <span id="score">0</span></div>
        
        <div id="skater">🏃</div>
        <div id="obstacle"></div>
        <div id="ground"></div>
        
        <div id="tap-instruction">Touchez l'écran pour faire une roulade</div>
        <div id="game-over-text"></div>

        <!-- AFFICHE DE PUBLICITÉ COMPLÈTE (FINIE LA PAGE NOIRE) -->
        <div id="pub-container">
            <div id="pub-card">
                <div id="pub-logo"></div>
                <h1 id="pub-title">100% GRATUIT</h1>
                <p id="pub-text">100% gratuit pour tous les joueurs !</p>
                <button id="pub-timer-btn">Annonce (<span id="timer-count">5</span>s)</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const skater = document.getElementById("skater");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");
        
        const pubContainer = document.getElementById("pub-container");
        const pubTimerBtn = document.getElementById("pub-timer-btn");
        const timerCount = document.getElementById("timer-count");

        let score = 0;
        let isJumping = false;
        let isGameOver = false;
        let isWatchingPub = false;
        let obstacleVitesse = 7;
        let animationFrameId;

        function handleAction(event) {
            if (isWatchingPub) return;
            if (event && event.target && (event.target.id === 'revive-btn' || event.target.id === 'pub-timer-btn')) return;
            
            if (isGameOver) {
