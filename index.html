<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skate Runner Fixed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #87CEEB;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #ffcc00;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            box-shadow: 0 5px 0 #b38f00;
        }
        #restartBtn {
            background: #2ecc71;
            box-shadow: 0 5px 0 #27ae60;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b38f00;
        }
        #restartBtn:active {
            box-shadow: 0 2px 0 #27ae60;
        }
        #ad-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #ad-image {
            max-width: 80%;
            max-height: 65%;
            border: 4px solid #fff;
            border-radius: 10px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        #ad-timer {
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <button id="adBtn" class="btn">Regarder une pub pour continuer</button>
        <button id="restartBtn" class="btn">Recommencer à zéro</button>
    </div>

    <div id="ad-screen">
        <img id="ad-image" src="image_5KM4x6.png" alt="Publicité">
        <div id="ad-timer">3s</div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth;
canvas.height = 400;

let score = 0;
let gameOver = false;
let isAdState = false;
let animationId = null;

const gravity = 0.6;
const groundY = canvas.height - 60;

const player = {
    x: 80,
    y: groundY - 60,
    width: 40,
    height: 60,
    vy: 0,
    isJumping: false,
    isRolling: false,
    rollTimer: 0,
    
    jump() {
        if (!this.isJumping && !this.isRolling && !gameOver && !isAdState) {
            this.vy = -13;
            this.isJumping = true;
        }
    },
    
    roll() {
        if (!this.isJumping && !this.isRolling && !gameOver && !isAdState) {
            this.isRolling = true;
            this.rollTimer = 30;
            this.height = 30;
            this.y = groundY - 30;
        }
    },

    update() {
        this.vy += gravity;
        this.y += this.vy;

        let currentGround = groundY - this.height;
        if (this.y > currentGround) {
            this.y = currentGround;
            this.vy = 0;
            this.isJumping = false;
        }

        if (this.isRolling) {
            this.rollTimer--;
            if (this.rollTimer <= 0) {
                this.isRolling = false;
                this.height = 60;
                this.y = groundY - this.height;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isRolling) {
            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.arc(this.width / 2, this.height / 2, 18, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(0, 0, this.width, this.height);

            ctx.fillStyle = "#000";
            ctx.fillRect(5, -10, 30, 10);
            ctx.fillRect(20, -7, 25, 4);
            
            ctx.fillStyle = "#fff";
            ctx.fillRect(25, 5, 8, 8);
            ctx.fillStyle = "#000";
            ctx.fillRect(29, 5, 4, 4);

            ctx.fillStyle = "#795548";
            ctx.fillRect(-5, this.height, this.width + 10, 6);
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(2, this.height + 9, 4, 0, Math.PI * 2);
            ctx.arc(this.width - 2, this.height + 9, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
};

let obstacles = [];
let spawnTimer = 0;

function spawnObstacle() {
    const type = Math.random() > 0.5 ? "high" : "low";
    if (type === "high") {
        obstacles.push({
            x: canvas.width,
            y: groundY - 75,
            width: 30,
            height: 30,
            color: "#e91e63"
        });
    } else {
        obstacles.push({
            x: canvas.width,
            y: groundY - 35,
            width: 30,
            height: 35,
            color: "#9c27b0"
        });
    }
}

// CORRECTION IMPORTANTE ICI : utilisation de e.touches[0].clientY
window.addEventListener("touchstart", (e) => {
    if (e.touches && e.touches.length > 0) {
        const touchY = e.touches[0].clientY;
        if (touchY < window.innerHeight / 2) {
            player.jump();
        } else {
            player.roll();
        }
    }
});

window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        player.jump();
    }
    if (e.code === "ArrowDown" || e.code === "KeyS") {
        e.preventDefault();
        player.roll();
    }
});

const adBtn = document.getElementById("adBtn");
const restartBtn = document.getElementById("restartBtn");
const adScreen = document.getElementById("ad-screen");
const adTimerText = document.getElementById("ad-timer");

function startNewGame() {
    if (animationId) cancelAnimationFrame(animationId);
    
    obstacles = []; 
    spawnTimer = 0;
    gameOver = false;
    isAdState = false;
    
    player.y = groundY - player.height;
    player.vy = 0;
    player.isJumping = false;
    player.isRolling = false;
    
    adBtn.style.display = "none";
    restartBtn.style.display = "none";
    
    loop();
}

adBtn.addEventListener("click", () => {
    adBtn.style.display = "none";
    restartBtn.style.display = "none";
    adScreen.style.display = "flex";
    isAdState = true;
    if (animationId) cancelAnimationFrame(animationId);
    
    let timeLeft = 3; 
    adTimerText.innerText = `${timeLeft}s`;

    let interval = setInterval(() => {
        timeLeft--;
        adTimerText.innerText = `${timeLeft}s`;
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            adScreen.style.display = "none";
            isAdState = false;
            gameOver = false;
            obstacles = [];
            player.y = groundY - player.height;
            player.vy = 0;
            loop();
        }
    }, 1000);
});

restartBtn.addEventListener("click", () => {
    score = 0; 
    startNewGame();
});

function loop() {
    if (gameOver || isAdState) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#333";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    player.update();
    player.draw();

    spawnTimer++;
    if (spawnTimer > 80) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= 6;

        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            gameOver = true;
            adBtn.style.display = "block";
            restartBtn.style.display = "block";
        }

        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
            score += 10;
        }
    }

    ctx.fillStyle = "#000";
    ctx.font = "bold 24px Arial";
    ctx.fillText(`Score: ${score}`, 20, 40);

    animationId = requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
