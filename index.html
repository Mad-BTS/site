<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mad-ME-BTS-Prog - Skate Jump Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-title {
            font-size: 36px;
            font-weight: 900;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #333;
            text-align: center;
        }

        #score-board {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 250px;
            border-bottom: 5px solid #333;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            overflow: hidden;
            cursor: pointer;
        }

        #skater {
            width: 40px;
            height: 60px;
            position: absolute;
            bottom: 0;
            left: 50px;
            background-color: #ff4757;
            border-radius: 5px;
        }

        #skater::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 50px;
            height: 8px;
            background-color: #2ed573;
            border-radius: 4px;
        }

        #obstacle {
            width: 25px;
            height: 40px;
            background-color: #ffa502;
            position: absolute;
            bottom: 0;
            left: 100%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .obstacle-move {
            animation: moveObstacle 2s infinite linear;
        }

        @keyframes moveObstacle {
            0% { left: 100%; }
            100% { left: -40px; }
        }

        .jump {
            animation: jumpAnimation 0.5s linear;
        }

        @keyframes jumpAnimation {
            0% { bottom: 0; }
            50% { bottom: 120px; }
            100% { bottom: 0; }
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        #game-over-text {
            font-size: 26px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
        }

        .btn-game {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            text-transform: uppercase;
            box-shadow: 0px 4px 0px #21a453;
        }

        .btn-game:active {
            transform: translateY(2px);
            box-shadow: 0px 2px 0px #21a453;
        }

        #btn-restart {
            background-color: #ffa502;
            box-shadow: 0px 4px 0px #cc8400;
        }
        #btn-restart:active {
            box-shadow: 0px 2px 0px #cc8400;
        }

        /* --- ÉCRAN DE LA PUB SIMULÉE --- */
        #simulation-pub {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e272e;
            z-index: 20;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #logo-simu {
            width: 80px;
            height: 35px;
            background-color: #ff4757;
            border-radius: 6px;
            position: relative;
            margin-bottom: 10px;
        }

        #logo-simu::before, #logo-simu::after {
            content: '';
            position: absolute;
            bottom: -6px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            border: 2px solid #2ed573;
        }
        #logo-simu::before { left: 8px; }
        #logo-simu::after { right: 8px; }

        .badge-gratuit {
            background-color: #2ed573;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .barre-chargement-conteneur {
            width: 50%;
            height: 6px;
            background-color: #485460;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .barre-chargement-progression {
            width: 0%;
            height: 100%;
            background-color: #2ed573;
        }

        @keyframes faussePubAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="game-title">Mad-ME-BTS-Prog</div>
    <div id="score-board">Score : <span id="score">0</span></div>

        </div>
        
        <!-- PUB SIMULÉE SANS POKI POUR L'INSTANT -->

            <div class="barre-chargement-conteneur">
                <div class="barre-chargement-progression" id="barre-prog"></div>
            </div>
        </div>
    </div>

    <script>
        const skater = document.getElementById("skater");

        // Gestion du bouton retour Android pour éviter les crashs de l'appli
        window.addEventListener('load', function() {
            window.history.pushState({ noBackExits: true }, '');
        });
        window.addEventListener('popstate', function(event) {
            window.history.pushState({ noBackExits: true }, '');
            if (isGameOver) {
                resetGame(true);
            }
        });

        // Commandes tactiles et clavier
        document.getElementById("game-container").addEventListener("touchstart", function(e) {
            if(e.target.classList.contains('btn-game') || isWatchingPub) return;
            e.preventDefault();
            if (!isGameOver) jump();
        }, { passive: false });

        document.getElementById("game-container").addEventListener("mousedown", function(e) {
            if(e.target.classList.contains('btn-game') || isWatchingPub || e.pointerType === 'touch') return;
            if (!isGameOver) jump();
        });

        document.addEventListener("keydown", function(e) {
            if (e.code === "Space" && !isGameOver && !isWatchingPub) {
                e.preventDefault();
                jump();
            }
        });

        btnRestart.addEventListener("click", (e) => { e.stopPropagation(); resetGame(true); });
        btnRevive.addEventListener("click", (e) => { e.stopPropagation(); watchAdAndRevive(); });

            if (isJumping || isGameOver || isWatchingPub) return;
            isJumping = true;
            skater.classList.add("jump");
            setTimeout(() => {
                skater.classList.remove("jump");
                isJumping = false;
            }, 500); 
        }

                    scoreDisplay.textContent = score;
                }
            }, 1000);
