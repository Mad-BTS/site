<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu de Skater - Backflip</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: linear-gradient(#87CEEB, #E0F6FF);
            border-bottom: 15px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
        }
        #skater {
            width: 50px;
            height: 60px;
            background-color: #ff4757;
            position: absolute;
            bottom: 0;
            left: 50px;
            border-radius: 8px;
            transform-origin: center center; /* Centre de rotation pour le backflip */
        }
        
        /* NOUVELLE ANIMATION : Saut arrière + roulade dans le ciel */
        .jump {
            animation: backflipAnimation 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        @keyframes backflipAnimation {
            0% { 
                bottom: 0; 
                transform: rotate(0deg); 
            }
            30% {
                /* Début de la montée et inclinaison arrière */
                transform: rotate(-90deg);
            }
            50% { 
                bottom: 140px; /* Plus haut pour la roulade de ciel */
                transform: rotate(-180deg); 
            }
            75% {
                /* Descente et fin de tour */
                transform: rotate(-270deg);
            }
            100% { 
                bottom: 0; 
                transform: rotate(-360deg); 
            }
        }

        #obstacle {
            width: 25px;
            height: 40px;
            background-color: #2f3542;
            position: absolute;
            bottom: 0;
            left: 600px;
            border-radius: 4px;
        }
        #score-display {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }
        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ff4757;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 20;
            width: 80%;
            max-width: 400px;
        }
        #pub-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 30;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #pub-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #pub-timer {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display">Score : <span id="score">0</span></div>
        <div id="skater"></div>
        <div id="obstacle"></div>
        
        <div id="game-over-text"></div>

        <div id="pub-container">
            <div id="pub-timer">Publicité : <span id="timer-count">3</span>s</div>
            <video id="pub-video" src="" muted playsinline></video>
        </div>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const skater = document.getElementById("skater");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");
        
        const pubContainer = document.getElementById("pub-container");
        const timerCount = document.getElementById("timer-count");

        let score = 0;
        let isJumping = false;
        let isGameOver = false;
        let isWatchingPub = false;
        let obstacleVitesse = 6;
        let animationFrameId;

        function handleAction(event) {
            if (isWatchingPub) return;

            if (event && event.target && event.target.id === 'revive-btn') {
                return;
            }
            
            if (isGameOver) {
                resetGame();
            } else {
                jump();
            }
        }

        window.addEventListener("touchstart", function(event) {
            if (event.target && event.target.id === 'revive-btn') return;
            event.preventDefault();
            handleAction(event);
        }, { passive: false });

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault();
                handleAction(event);
            }
        });

        window.addEventListener("mousedown", function(event) {
            if (event.pointerType !== 'touch') {
                handleAction(event);
            }
        });

        function jump() {
            if (isJumping || isGameOver || isWatchingPub) return;
            isJumping = true;
            skater.classList.add("jump");
            
            // Temps ajusté à 600ms (0.6s) pour que la rotation soit fluide
            setTimeout(() => {
                skater.classList.remove("jump");
                isJumping = false;
            }, 600);
        }

        function gameLoop() {
            if (isGameOver || isWatchingPub) return;
            let containerWidth = container.offsetWidth;
            let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));
            
            if (obstacleLeft < -25) {
                obstacleLeft = containerWidth;
                score++;
                scoreDisplay.innerText = score;
                
                if (score % 5 === 0) {
                    obstacleVitesse += 1;
                }
            }
            
            obstacle.style.left = (obstacleLeft - obstacleVitesse) + "px";
            let skaterBottom = parseInt(window.getComputedStyle(skater).getPropertyValue("bottom"));
            
            if (obstacleLeft > 50 && obstacleLeft < 90 && skaterBottom < 40) {
                endGame();
                return;
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);
            
            gameOverText.innerHTML = `
                FIN DE LA PARTIE<br>
                <span style="font-size: 16px; color: #333; display:block; margin-bottom:10px;">Votre Score : ${score}</span>
                <button id="revive-btn" style="background-color: #2ed573; color: white; font-size: 16px; font-weight: bold; padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);">
                    🎬 Continuer (Pub)
                </button>
                <br><span style="font-size: 14px; color: #666; display:block; margin-top:10px;">Ou cliquez ailleurs pour recommencer à 0</span>
            `;
            gameOverText.style.display = "block";

            document.getElementById("revive-btn").addEventListener("click", regarderPubPourContinuer);
        }

        function regarderPubPourContinuer(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            gameOverText.style.display = "none";
            isWatchingPub = true;
            pubContainer.style.display = "flex";
            
            let timeLeft = 3;
            timerCount.innerText = timeLeft;

            let pubInterval = setInterval(() => {
                timeLeft--;
                timerCount.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(pubInterval);
                    pubContainer.style.display = "none";
                    isWatchingPub = false;
                    isGameOver = false;

                    let containerWidth = container.offsetWidth;
                    obstacle.style.left = containerWidth + "px";

                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            }, 1000);
        }

        function resetGame() {
            score = 0;
            obstacleVitesse = 6;
            scoreDisplay.innerText = score;
            isGameOver = false;
            isWatchingPub = false;
            gameOverText.style.display = "none";
            
            let containerWidth = container.offsetWidth;
            obstacle.style.left = containerWidth + "px";
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
