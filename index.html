<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mad-BTS-Prog</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            touch-action: manipulation; /* Évite le zoom automatique sur mobile */
        }
        canvas {
            background-color: #87CEEB;
            border: 4px solid #fff;
            box-shadow: 0px 0px 20px rgba(255,255,255,0.2);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Mad-BTS-Prog</h1>
    <p>Appuyez sur la <strong>Barre Espace</strong> ou <strong>touchez l'écran</strong> pour faire un Kickflip !</p>
    <canvas id="jeuCanvas" width="800" height="300"></canvas>

<script>
const canvas = document.getElementById("jeuCanvas");
const ctx = canvas.getContext("2d");

// Physics baseline constants
const GROUND_Y = 200;
const GRAVITY = 0.6;
const JUMP_POWER = -12;

// Calculate flight duration to perfectly sync the 360 flip rotation
const airTimeFrames = Math.abs(JUMP_POWER / GRAVITY) * 2;
const rotationStep = (Math.PI * 2) / airTimeFrames;

let skater = {
    x: 80,
    y: GROUND_Y,
    width: 40,
    height: 60,
    vy: 0,
    gravity: GRAVITY,
    jumpPower: JUMP_POWER,
    isJumping: false,
    angle: 0
};

let obstacle = {
    x: 800,
    y: 220,
    width: 30,
    height: 40,
    speed: 6
};

let score = 0;
let gameOver = false;

// Fonction universelle pour sauter ou redémarrer
function handleAction() {
    if (!skater.isJumping && !gameOver) {
        skater.vy = skater.jumpPower;
        skater.isJumping = true;
    } else if (gameOver) {
        resetGame();
    }
}

// Contrôle Clavier (Espace)
document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault(); // Empêche la page de défiler vers le bas
        handleAction();
    }
});

// Contrôle Tactile (Mobile) & Clic Souris
window.addEventListener("touchstart", function(e) {
    // Empêche les comportements de zoom ou double-tap natifs sur le jeu
    if (e.target === canvas || e.target.tagName === "BODY") {
        handleAction();
    }
}, { passive: true });

function resetGame() {
    skater.y = GROUND_Y;
    skater.vy = 0;
    skater.isJumping = false;
    skater.angle = 0;
    obstacle.x = 800;
    obstacle.speed = 6;
    score = 0;
    gameOver = false;
    loop();
}

function update() {
    if (gameOver) return;

    // Jump physics
    skater.vy += skater.gravity;
    skater.y += skater.vy;

    // Synced Kickflip rotation loop
    if (skater.isJumping) {
        skater.angle += rotationStep;
    }

    // Landing detection
    if (skater.y > GROUND_Y) {
        skater.y = GROUND_Y;
        skater.vy = 0;
        skater.isJumping = false;
        skater.angle = 0; 
    }

    // Obstacle logic
    obstacle.x -= obstacle.speed;
    if (obstacle.x < -obstacle.width) {
        obstacle.x = 800;
        score++;
        obstacle.speed += 0.3;
    }

    // Precise inner collision mapping
    let skaterHitbox = {
        x: skater.x + 8,
        y: skater.y + 5,
        width: skater.width - 16,
        height: skater.height - 5
    };

    if (
        obstacle.x < skaterHitbox.x + skaterHitbox.width &&
        obstacle.x + obstacle.width > skaterHitbox.x &&
        obstacle.y < skaterHitbox.y + skaterHitbox.height &&
        obstacle.y + obstacle.height > skaterHitbox.y
    ) {
        gameOver = true;
    }
}

function drawSkater() {
    ctx.save();
    ctx.translate(skater.x + skater.width / 2, skater.y + skater.height / 2);
    ctx.rotate(skater.angle);

    let ox = -skater.width / 2;
    let oy = -skater.height / 2;

    // 1. Torso
    ctx.fillStyle = "#3498db";
    ctx.fillRect(ox + 10, oy + 20, 20, 25);

    // 2. Head
    ctx.fillStyle = "#ffdbac";
    ctx.fillRect(ox + 13, oy + 5, 14, 15);

    // 3. Cap
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(ox + 10, oy, 17, 6); 
    ctx.fillRect(ox + 18, oy + 4, 14, 3); 

    // 4. Pants
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(ox + 10, oy + 45, 9, 10); 
    ctx.fillRect(ox + 21, oy + 45, 9, 10); 

    // 5. Skateboard deck & wheels
    ctx.fillStyle = "#d35400"; 
    ctx.fillRect(ox, oy + 55, skater.width, 5);

    ctx.fillStyle = "#000"; 
    ctx.beginPath();
    ctx.arc(ox + 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ox + skater.width - 8, oy + 61, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    // Environment background
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sun
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(700, 50, 30, 0, Math.PI * 2);
    ctx.fill();

    // Sidewalk pavement
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(0, 260, canvas.width, 40);
    ctx.fillStyle = "#95a5a6"; 
    ctx.fillRect(0, 260, canvas.width, 4);

    drawSkater();

    // Fire hydrant obstacle
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(obstacle.x + 5, obstacle.y - 5, obstacle.width - 10, 5);

    // Score display
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 4;
    ctx.fillText("Score : " + score, 20, 35);
    
    // Clear shadow configurations for elements
    ctx.shadowBlur = 0;

    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 40px Arial";
        ctx.fillText("GAME OVER", canvas.width / 2, 130);
        
        ctx.font = "20px Arial";
        ctx.fillText("Appuyez ou touchez pour retenter !", canvas.width / 2, 180);
        ctx.textAlign = "left"; // Reset baseline alignment
    }
}

function loop() {
    update();
    draw();
    if (!gameOver) {
        requestAnimationFrame(loop);
    }
}

loop();
</script>
</body>
</html>
