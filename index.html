<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Intégration du script publicitaire officiel de Poki -->
    <script src="https://poki.com"></script>
    <title>Mad-ME-BTS-Prog - Skate Jump Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-title {
            font-size: 36px;
            font-weight: 900;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #333;
            text-align: center;
        }

        #score-board {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 250px;
            border-bottom: 5px solid #333;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            overflow: hidden;
            cursor: pointer;
        }

        #skater {
            width: 40px;
            height: 60px;
            position: absolute;
            bottom: 0;
            left: 50px;
            background-color: #ff4757;
            border-radius: 5px;
        }

        #skater::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 50px;
            height: 8px;
            background-color: #2ed573;
            border-radius: 4px;
        }

        #obstacle {
            width: 25px;
            height: 40px;
            background-color: #ffa502;
            position: absolute;
            bottom: 0;
            left: 100%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .jump {
            animation: jumpAnimation 0.5s linear;
        }

        @keyframes jumpAnimation {
            0% { bottom: 0; transform: rotate(0deg); }
            50% { bottom: 120px; transform: rotate(-180deg); }
            100% { bottom: 0; transform: rotate(-360deg); }
        }

        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: bold;
            color: #ff4757;
            text-align: center;
            width: 100%;
        }

        /* --- STYLE DE LA FAUSSE PUBLICITÉ --- */
        #pub-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none; /* Caché par défaut */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #pub-contenu {
            text-align: center;
            color: white;
            font-family: sans-serif;
        }

        #pub-video {
            max-width: 90%;
            max-height: 70vh;
            border: 2px solid #555;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="game-title">Mad-ME-BTS-Prog</div>

    <div id="score-board">Score : <span id="score">0</span></div>
    
    <div id="game-container">
        <div id="skater"></div>
        <div id="obstacle"></div>
        <div id="game-over-text"></div>
    </div>

    <!-- FENÊTRE DE SIMULATION DE PUB DE VIDÉO -->
    <div id="pub-container">
        <div id="pub-contenu">
            <p style="font-size: 18px; margin-bottom: 15px; font-weight: bold; color: #ffa502;">🎬 Publicité en cours (Simulation Poki)...</p>
            <!-- IMPORTANT : Remplace "ma-video.mp4" par le nom exact de ton fichier vidéo sur ton GitHub -->
            <video id="pub-video" width="480" height="270" playsinline>
                <source src="ma-video.mp4" type="video/mp4">
                Votre navigateur ne supporte pas les vidéos.
            </video>
        </div>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const skater = document.getElementById("skater");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");
        
        // Nouveaux éléments pour la vidéo
        const pubContainer = document.getElementById("pub-container");
        const pubVideo = document.getElementById("pub-video");

        let score = 0;
        let isJumping = false;
        let isGameOver = false;
        let isWatchingPub = false; // Sécurité pour bloquer le jeu pendant la vidéo
        let obstacleSpeed = 5;
        let animationFrameId;

        if (typeof PokiSDK !== 'undefined') {
            PokiSDK.init().then(() => {
                console.log("Poki SDK chargé avec succès !");
            }).catch(() => {
                console.log("Mode test actif.");
            });
        }

        function handleAction(event) {
            // Sécurité : Si on regarde une pub ou clique sur le bouton, on ne saute pas
            if (isWatchingPub) return;
            if (event && event.target && event.target.id === 'revive-btn') {
                return;
            }
            
            if (isGameOver) {
                resetGame();
            } else {
                jump();
            }
        }

        window.addEventListener("touchstart", function(event) {
            if (event.target && event.target.id === 'revive-btn') return;
            if (isWatchingPub) return;
            
            event.preventDefault(); 
            handleAction(event);
        }, { passive: false });

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault(); 
                handleAction(event);
            }
        });

        window.addEventListener("mousedown", function(event) {
            if (event.pointerType !== 'touch') {
                handleAction(event);
            }
        });

        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            skater.classList.add("jump");

            setTimeout(() => {
                skater.classList.remove("jump");
                isJumping = false;
            }, 500); 
        }

        function gameLoop() {
            if (isGameOver || isWatchingPub) return;

            let containerWidth = container.offsetWidth;
            let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));
            
            if (obstacleLeft < -25) {
                obstacleLeft = containerWidth;
                score++;
                scoreDisplay.innerText = score;
                
                if (score % 5 === 0) {
                    obstacleSpeed += 1;
                }
            }
            
            obstacle.style.left = (obstacleLeft - obstacleSpeed) + "px";

            let skaterBottom = parseInt(window.getComputedStyle(skater).getPropertyValue("bottom"));
            
            if (obstacleLeft > 50 && obstacleLeft < 90 && skaterBottom < 40) {
                endGame();
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);
            
            gameOverText.innerHTML = `
                GAME OVER<br>
                <span style="font-size: 16px; color: #333; display:block; margin-bottom:10px;">Ton score : ${score}</span>
                <button id="revive-btn" onclick="regarderPubPourContinuer(event)" style="background-color: #2ed573; color: white; font-size: 16px; font-weight: bold; padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);">
                    🎬 Continuer le score (Regarder la pub)
                </button>
                <br><span style="font-size: 14px; color: #666; display:block; margin-top:10px;">Ou touche l'écran ailleurs pour recommencer à 0</span>
            `;
            gameOverText.style.display = "block";
        }

        function regarderPubPourContinuer(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation(); 
            }
            
            // On cache le texte Game Over temporairement
            gameOverText.style.display = "none";
            isWatchingPub = true;

            // Déclenchement de la simulation vidéo locale
            pubContainer.style.display = "flex";
            pubVideo.currentTime = 0; // Remet la vidéo à zéro
            
            // Lancement de la vidéo avec gestion des restrictions de certains navigateurs
            pubVideo.play().catch(error => {
                console.log("Lecture auto bloquée, activation du son requis ou clic utilisateur nécessaire.", error);
                // En cas de blocage strict du navigateur, on force quand même la suite
                setTimeout(reprendreLaPartie, 3000);
            });
        }

        // Événement automatique qui s'active quand ta vidéo se termine
